<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            background-color: #fff; 
            font-family: sans-serif;
        }
        canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
        }
        /* Estilo do Tooltip flutuante ao passar o mouse */
        #tooltip {
            position: absolute;
            display: none;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="tooltip"></div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.AmbientLight(0xffffff, 1);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(5, 5, 5);
        controls.update();

        let loadedModel = null;
        const loader = new THREE.GLTFLoader();
        
        loader.load('LAYOUT ESTOQUE 3D.glb', (gltf) => {
            loadedModel = gltf.scene;
            scene.add(loadedModel);
            
            // --- TRatAMENTO DO FILTRO VINDO DO POWER BI ---
            const params = new URLSearchParams(window.location.search);
            const enderecoFiltro = params.get('endereco');
            
            if (enderecoFiltro) {
                const buscaLimpa = enderecoFiltro.trim().toLowerCase();
                
                loadedModel.traverse((child) => {
                    if (child.name && child.name.trim().toLowerCase() === buscaLimpa) {
                        child.material = child.material.clone();
                        child.material.color.set(0xff0000); 
                        child.material.emissive.set(0xff3300);
                        child.material.emissiveIntensity = 0.8; 

                        // Foca a câmera no objeto encontrado
                        const box = new THREE.Box3().setFromObject(child);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3()).length();

                        controls.target.copy(center);
                        camera.position.set(center.x + size * 1.5, center.y + size * 1.5, center.z + size * 1.5);
                        controls.update();
                    }
                });
            }
        });

        // --- INTERATIVIDADE: TOOLTIP AO PASSAR O MOUSE ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');

        window.addEventListener('mousemove', (event) => {
            if (!loadedModel) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(loadedModel.children, true);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                // Se o objeto tiver nome válido cadastrado no Blender
                if (obj.name && obj.name.trim() !== "") {
                    tooltip.style.display = 'block';
                    tooltip.style.left = (event.clientX + 15) + 'px';
                    tooltip.style.top = (event.clientY + 15) + 'px';
                    tooltip.innerHTML = `Endereço: <b>${obj.name}</b>`;
                } else {
                    tooltip.style.display = 'none';
                }
            } else {
                tooltip.style.display = 'none';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); 
            renderer.render(scene, camera); 
        }
        animate();
    </script>
</body>
</html>
