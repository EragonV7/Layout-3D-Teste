<!DOCTYPE html>
<html>
<head>
    <style>body { margin: 0; overflow: hidden; background-color: #fff; }</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- ADICIONADO: OrbitControls para mouse -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Adiciona luzes para dar profundidade (importante para não parecer plano)
        const light = new THREE.AmbientLight(0xffffff, 1);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // CONTROLES DE MOUSE (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(5, 5, 5);
        controls.update();

        const loader = new THREE.GLTFLoader();
        // Substitua pelo nome correto do seu arquivo .glb
        loader.load('LAYOUT ESTOQUE 3D.glb', (gltf) => {
            const model = gltf.scene;
            scene.add(model);
            
            const params = new URLSearchParams(window.location.search);
            const endereco = params.get('endereco');
            
            if (endereco) {
                model.traverse((child) => {
                    if (child.name === endereco) {
                        child.material.color.set(0xff0000); // Destaca em vermelho
                    }
                });
            }
        });

        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); // Necessário para OrbitControls
            renderer.render(scene, camera); 
        }
        animate();
    </script>
</body>
</html>
