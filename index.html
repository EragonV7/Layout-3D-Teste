<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        /* IMPORTANTE: Força o HTML e o Body a ocuparem 100% da tela */
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            background-color: #fff; 
        }
        canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        // Usa o tamanho atual da janela do navegador/iframe
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.AmbientLight(0xffffff, 1);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(5, 5, 5);
        controls.update();

        const loader = new THREE.GLTFLoader();
        // Carrega o seu modelo 3D do galpão
        loader.load('LAYOUT ESTOQUE 3D.glb', (gltf) => {
            const model = gltf.scene;
            scene.add(model);
            
            const params = new URLSearchParams(window.location.search);
            const endereco = params.get('endereco');
            
            if (endereco) {
                model.traverse((child) => {
                    if (child.name === endereco) {
                        // Clona o material para alterar apenas este objeto sem afetar os outros
                        child.material = child.material.clone();
                        
                        // Cor vermelha viva e brilho emissivo (efeito neon)
                        child.material.color.set(0xff0000); 
                        child.material.emissive.set(0xff3300);
                        child.material.emissiveIntensity = 0.8; 

                        // Foca a câmera automaticamente no objeto selecionado
                        const box = new THREE.Box3().setFromObject(child);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3()).length();

                        controls.target.copy(center);
                        camera.position.set(center.x + size * 1.5, center.y + size * 1.5, center.z + size * 1.5);
                        controls.update();
                    }
                });
            }
        });

        // Garante que se o painel mudar de tamanho, o 3D se ajusta
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); 
            renderer.render(scene, camera); 
        }
        animate();
    </script>
</body>
</html>
