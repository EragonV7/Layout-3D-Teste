<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Layout 3D - Power BI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f4f4f4; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        
        /* Controles */
        #ui-controles { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; max-width: 400px; }
        .btn { background: #252423; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; transition: background 0.3s; }
        .btn:hover { background: #0078D4; }
        .btn-toggle-ativo { background: #107c41 !important; } 
        .btn-status { background: #8e44ad; } 

        /* Placas de Corredor (CSS2D) */
        .placa-corredor { background: rgba(0, 0, 0, 0.85); color: #ffffff; padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 16px; border: 2px solid #0078D4; pointer-events: none; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }

        /* Tooltip */
        #tooltip { position: absolute; background: rgba(0,0,0,0.9); color: #fff; padding: 10px 14px; border-radius: 6px; display: none; pointer-events: none; z-index: 50; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 8px rgba(0,0,0,0.4); border-left: 3px solid #0078D4; }

        /* Painel KPI */
        #painel-kpi { position: absolute; top: 15px; right: 15px; width: 280px; z-index: 30; background: #ffffff; border-radius: 8px; box-shadow: 0px 8px 25px rgba(0,0,0,0.4); display: none; overflow: hidden; border-top: 4px solid #0078D4; }
        #painel-kpi .cabecalho { background: #f8f9fa; color: #333; padding: 12px 15px; display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; border-bottom: 1px solid #eee; }
        #painel-kpi .fechar { cursor: pointer; font-size: 18px; color: #999; }
        #painel-kpi .fechar:hover { color: #e74c3c; }
        #painel-kpi .corpo { padding: 15px; }
        #painel-kpi .linha { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        #painel-kpi .rotulo { color: #666; }
        #painel-kpi .valor { font-weight: bold; color: #222; text-align: right; }
        .barra-fundo { background: #e0e0e0; border-radius: 4px; height: 10px; margin-top: 5px; overflow: hidden; }
        .barra-preenchida { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    </style>

    <!-- Bibliotecas Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>
    
    <div id="ui-controles">
        <button class="btn" id="btn-frente">Frente</button>
        <button class="btn" id="btn-topo">Topo</button>
        <button class="btn" id="btn-lado">Lado</button>
        <button class="btn btn-status" id="btn-status">Modo: Status (Desligado)</button>
        <button class="btn" id="btn-wasd">Visão: 1ª Pessoa</button>
    </div>

    <div id="tooltip"></div>

    <div id="painel-kpi">
        <div class="cabecalho"><span id="kpi-endereco">Endereço</span><span class="fechar" id="kpi-fechar">&times;</span></div>
        <div class="corpo">
            <div class="linha"><span class="rotulo">Produto</span><span class="valor" id="kpi-produto">-</span></div>
            <div class="linha"><span class="rotulo">Estoque</span><span class="valor" id="kpi-estoque">-</span></div>
            <div class="linha"><span class="rotulo">Capacidade</span><span class="valor" id="kpi-capacidade">-</span></div>
            <div class="linha"><span class="rotulo">Status</span><span class="valor" id="kpi-status">-</span></div>
            <div style="margin-top: 15px;">
                <div class="linha" style="margin-bottom: 2px;"><span class="rotulo">Ocupação</span><span class="valor" id="kpi-pct">0%</span></div>
                <div class="barra-fundo"><div class="barra-preenchida" id="kpi-barra"></div></div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. ESTADO E COMUNICAÇÃO COM O POWER BI ---
        let dadosMap = {};
        let arrSelecionados = [];
        let modoStatusAtivo = false;

        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'dadosPowerBI') {
                dadosMap = {};
                if (Array.isArray(event.data.dadosEstoque)) {
                    event.data.dadosEstoque.forEach(d => { dadosMap[d.endereco] = d; });
                }
                
                if (event.data.selecionados && event.data.selecionados.trim() !== "") {
                    arrSelecionados = event.data.selecionados.split(',').map(s => s.trim());
                } else {
                    arrSelecionados = [];
                }
                
                aplicarFiltrosECores();
            }
        });

        // --- 2. CONFIGURAÇÃO DO THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f4f4);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // Não intercepta o mouse
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 150, 50);
        scene.add(dirLight);

        let modeloGeral = null;
        let boxGeral = null;
        let centroGeral = new THREE.Vector3();
        let tamanhoMax = 0;
        let placasGeral = [];

        // Raycaster e Interação
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        const painelKPI = document.getElementById('painel-kpi');

        // Movimentação WASD
        let modoWASD = false;
        const teclas = { w: false, a: false, s: false, d: false };

        // --- 3. CARREGANDO O MODELO GLTF ---
        const gltfUrl = 'https://raw.githubusercontent.com/EragonV7/Layout-3D-Teste/main/LAYOUT%20ESTOQUE%203D.glb';
        const loader = new THREE.GLTFLoader();
        
        loader.load(gltfUrl, function (gltf) {
            modeloGeral = gltf.scene; 
            scene.add(modeloGeral);
            
            boxGeral = new THREE.Box3().setFromObject(modeloGeral);
            centroGeral = boxGeral.getCenter(new THREE.Vector3());
            const size = boxGeral.getSize(new THREE.Vector3());
            tamanhoMax = Math.max(size.x, size.y, size.z);
            
            controls.target.copy(centroGeral);
            camera.position.set(centroGeral.x + (tamanhoMax * 0.8), centroGeral.y + (tamanhoMax * 0.8), centroGeral.z + (tamanhoMax * 0.8));
            
            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    child.material = child.material.clone();
                    child.userData.corOriginal = child.material.color.getHex();
                }
            });

            criarPlacasCorredor();
            aplicarFiltrosECores();
        });

        // --- 4. FUNÇÕES DE SUPORTE E FILTROS ---
        function corPorStatus(status) {
            const s = (status || '').toUpperCase();
            if (s === 'CRITICO' || s === 'CRÍTICO') return 0xe74c3c;
            if (s === 'BAIXO') return 0xf1c40f;
            return 0x2ecc71; 
        }

        function extrairEndereco(nome) { 
            if (!nome) return null;
            const m = nome.toUpperCase().match(/([A-Z]\d{2}-N\d{2})/); 
            return m ? m[1] : null; 
        }

        function getEnderecoDaHierarquia(obj) { 
            let atual = obj; 
            while(atual) { 
                const end = extrairEndereco(atual.name); 
                if (end) return end; 
                atual = atual.parent; 
            } 
            return null; 
        }

        function aplicarFiltrosECores() {
            if(!modeloGeral) return;
            
            modeloGeral.traverse(child => {
                if (!child.isMesh) return;
                
                const end = getEnderecoDaHierarquia(child);
                if (!end) return;

                // Valida se o elemento do 3D está na lista selecionada no Power BI
                const estaSelecionado = arrSelecionados.length === 0 || arrSelecionados.some(sel => sel.includes(end) || end.includes(sel));

                if (!estaSelecionado) {
                    child.material.transparent = true;
                    child.material.opacity = 0.12;
                    child.material.depthWrite = false; // CORRIGE O EFEITO "ZUADO" NA TRANSPARÊNCIA
                } else {
                    child.material.transparent = false;
                    child.material.opacity = 1.0;
                    child.material.depthWrite = true; // RESTAURA PROFUNDIDADE NORMAL
                }

                if (modoStatusAtivo && dadosMap[end]) {
                    const corHex = corPorStatus(dadosMap[end].status);
                    child.material.color.setHex(corHex);
                } else {
                    if (child.userData.corOriginal !== undefined) {
                        child.material.color.setHex(child.userData.corOriginal);
                    }
                }
            });
        }

        // --- 5. PLACAS DOS CORREDORES (Apenas Corredor A, B, C) ---
        function criarPlacasCorredor() {
            placasGeral.forEach(p => scene.remove(p));
            placasGeral = [];

            const posicoesPorLetra = {};

            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    const end = getEnderecoDaHierarquia(child);
                    if (end) {
                        // Pega apenas a Letra principal (A, B ou C)
                        const letra = end.charAt(0).toUpperCase(); 
                        if (['A', 'B', 'C'].includes(letra)) {
                            if (!posicoesPorLetra[letra]) {
                                posicoesPorLetra[letra] = { soma: new THREE.Vector3(), contador: 0, maxY: -Infinity };
                            }
                            const pos = new THREE.Vector3();
                            child.getWorldPosition(pos);
                            posicoesPorLetra[letra].soma.add(pos);
                            posicoesPorLetra[letra].contador++;

                            const box = new THREE.Box3().setFromObject(child);
                            if (box.max.y > posicoesPorLetra[letra].maxY) {
                                posicoesPorLetra[letra].maxY = box.max.y;
                            }
                        }
                    }
                }
            });

            // Cria exatamente 3 placas
            for (let letra of ['A', 'B', 'C']) {
                if (posicoesPorLetra[letra] && posicoesPorLetra[letra].contador > 0) {
                    const dados = posicoesPorLetra[letra];
                    const centro = dados.soma.divideScalar(dados.contador);

                    const div = document.createElement('div');
                    div.className = 'placa-corredor';
                    div.textContent = `Corredor ${letra}`;

                    const placaCSS = new THREE.CSS2DObject(div);
                    placaCSS.position.set(centro.x, dados.maxY + 3.0, centro.z);
                    scene.add(placaCSS);
                    placasGeral.push(placaCSS);
                }
            }
        }

        // --- 6. RAYCASTER / TOOLTIP / FILTRO POR CLIQUE NO 3D ---
        function atualizarMouse(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

        window.addEventListener('mousemove', (e) => {
            atualizarMouse(e);
            if (!modeloGeral) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modeloGeral.children, true);

            if (intersects.length > 0) {
                let end = null;
                for (let i = 0; i < intersects.length; i++) {
                    end = getEnderecoDaHierarquia(intersects[i].object);
                    if (end) break;
                }

                if (end) {
                    const info = dadosMap[end] || { produto: 'Sem dados', estoque: 0, capacidade: 0 };
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                    tooltip.innerHTML = `<strong>Endereço: ${end}</strong><br>Produto: ${info.produto}<br>Estoque: ${info.estoque}/${info.capacidade}`;
                } else {
                    tooltip.style.display = 'none';
                }
            } else {
                tooltip.style.display = 'none';
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('#ui-controles') || e.target.closest('#painel-kpi')) return;
            if (!modeloGeral) return;

            atualizarMouse(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modeloGeral.children, true);

            if (intersects.length > 0) {
                let end = null;
                for (let i = 0; i < intersects.length; i++) {
                    end = getEnderecoDaHierarquia(intersects[i].object);
                    if (end) break;
                }

                if (end) {
                    // Exibe KPI
                    exibirKPI(end, dadosMap[end] || {});

                    // Notifica a janela pai (Power BI) para realizar a filtragem cruzada
                    if (window.parent) {
                        window.parent.postMessage({
                            tipo: 'filtro3D',
                            endereco: end
                        }, '*');
                    }
                }
            }
        });

        function exibirKPI(endereco, d) {
            document.getElementById('kpi-endereco').innerText = endereco;
            document.getElementById('kpi-produto').innerText = d.produto || 'N/A';
            document.getElementById('kpi-estoque').innerText = d.estoque ?? 0;
            document.getElementById('kpi-capacidade').innerText = d.capacidade ?? 0;
            document.getElementById('kpi-status').innerText = d.status || 'OK';

            const cap = Number(d.capacidade) || 0;
            const est = Number(d.estoque) || 0;
            const pct = cap > 0 ? Math.round((est / cap) * 100) : 0;

            document.getElementById('kpi-pct').innerText = pct + '%';
            const barra = document.getElementById('kpi-barra');
            barra.style.width = Math.min(pct, 100) + '%';
            barra.style.background = pct > 90 ? '#e74c3c' : (pct > 50 ? '#f1c40f' : '#2ecc71');

            painelKPI.style.display = 'block';
        }

        document.getElementById('kpi-fechar').addEventListener('click', () => {
            painelKPI.style.display = 'none';
        });

        // --- 7. BOTÕES E VISÃO ---
        document.getElementById('btn-status').addEventListener('click', function() {
            modoStatusAtivo = !modoStatusAtivo;
            this.innerText = modoStatusAtivo ? 'Modo: Status (Ligado)' : 'Modo: Status (Desligado)';
            this.style.background = modoStatusAtivo ? '#107c41' : '#8e44ad';
            aplicarFiltrosECores();
        });

        document.getElementById('btn-frente').addEventListener('click', () => {
            if(!centroGeral) return;
            camera.position.set(centroGeral.x, centroGeral.y + (tamanhoMax * 0.2), centroGeral.z + (tamanhoMax * 1.2));
            controls.target.copy(centroGeral);
            controls.update();
        });

        document.getElementById('btn-topo').addEventListener('click', () => {
            if(!centroGeral) return;
            camera.position.set(centroGeral.x, centroGeral.y + (tamanhoMax * 1.5), centroGeral.z + 0.1);
            controls.target.copy(centroGeral);
            controls.update();
        });

        document.getElementById('btn-lado').addEventListener('click', () => {
            if(!centroGeral) return;
            camera.position.set(centroGeral.x + (tamanhoMax * 1.2), centroGeral.y + (tamanhoMax * 0.2), centroGeral.z);
            controls.target.copy(centroGeral);
            controls.update();
        });

        // WASD
        const btnWASD = document.getElementById('btn-wasd');
        btnWASD.addEventListener('click', () => {
            modoWASD = !modoWASD;
            if(modoWASD) {
                btnWASD.classList.add('btn-toggle-ativo');
                btnWASD.innerText = 'Visão: 1ª Pessoa (ON)';
                const chaoY = boxGeral ? boxGeral.min.y : 0;
                camera.position.set(centroGeral.x, chaoY + 1.8, centroGeral.z + (tamanhoMax * 0.3));
                controls.target.set(centroGeral.x, chaoY + 1.8, centroGeral.z);
            } else {
                btnWASD.classList.remove('btn-toggle-ativo');
                btnWASD.innerText = 'Visão: 1ª Pessoa';
                camera.position.set(centroGeral.x + (tamanhoMax * 0.8), centroGeral.y + (tamanhoMax * 0.8), centroGeral.z + (tamanhoMax * 0.8));
                controls.target.copy(centroGeral);
            }
            controls.update();
        });

        window.addEventListener('keydown', (e) => {
            if(!modoWASD) return;
            const k = e.key.toLowerCase();
            if (teclas.hasOwnProperty(k)) teclas[k] = true;
        });

        window.addEventListener('keyup', (e) => {
            if(!modoWASD) return;
            const k = e.key.toLowerCase();
            if (teclas.hasOwnProperty(k)) teclas[k] = false;
        });

        function moverWASD() {
            if(!modoWASD) return;
            const vel = 0.4;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

            if(teclas.w) { camera.position.addScaledVector(dir, vel); controls.target.addScaledVector(dir, vel); }
            if(teclas.s) { camera.position.addScaledVector(dir, -vel); controls.target.addScaledVector(dir, -vel); }
            if(teclas.a) { camera.position.addScaledVector(side, vel); controls.target.addScaledVector(side, vel); }
            if(teclas.d) { camera.position.addScaledVector(side, -vel); controls.target.addScaledVector(side, -vel); }

            const chaoY = boxGeral ? boxGeral.min.y : 0;
            if (camera.position.y < chaoY + 1.8) {
                camera.position.y = chaoY + 1.8;
            }
        }

        // --- 8. LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);
            moverWASD();
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
