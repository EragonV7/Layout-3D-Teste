<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 3D - Power BI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0d10; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        
        /* Painel de Controles (Câmeras e Status) - Mantido na Esquerda */
        #ui-controles { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; max-width: 420px; }
        .btn { background: #252423; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; transition: background 0.3s, transform 0.1s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn:hover { background: #0078D4; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-toggle-ativo { background: #107c41 !important; } 
        .btn-status { background: #8e44ad; } 

        /* HUD Global - Forçado para a DIREITA com !important para quebrar o cache do PBI */
        #hud-topo { position: absolute !important; top: 15px !important; right: 15px !important; left: auto !important; transform: none !important; background: #252423; display: flex; gap: 25px; padding: 12px 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 20; border-bottom: 4px solid #0078D4; }
        .hud-box { text-align: center; color: #fff; min-width: 80px; }
        .hud-box .titulo { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; font-weight: bold; }
        .hud-box .valor { font-size: 20px; font-weight: bold; }

        /* Placas de Corredor (CSS2D) */
        .placa-corredor { background: rgba(0, 0, 0, 0.85); color: #ffffff; padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 16px; border: 2px solid #0078D4; pointer-events: none; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }

        /* Tooltip Flutuante */
        #tooltip { position: absolute; background: #ffffff; color: #333; padding: 12px 16px; border-radius: 6px; display: none; pointer-events: none; z-index: 9999; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); border-top: 4px solid #0078D4; min-width: 170px; }
        .tt-header { font-weight: bold; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; color: #0078D4; }
        .tt-line { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .tt-label { color: #666; }
        .tt-value { font-weight: bold; color: #111; text-align: right; margin-left: 20px; }

        /* Painel Lateral KPI - Forçado abaixo do HUD */
        #painel-kpi { position: absolute !important; top: 95px !important; right: 15px !important; left: auto !important; transform: none !important; width: 280px; z-index: 30; background: #ffffff; border-radius: 8px; box-shadow: 0px 8px 25px rgba(0,0,0,0.3); display: none; overflow: hidden; border-top: 4px solid #0078D4; }
        #painel-kpi .cabecalho { background: #f8f9fa; color: #333; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; border-bottom: 1px solid #eee; }
        #painel-kpi .fechar { cursor: pointer; font-size: 20px; color: #999; line-height: 1; }
        #painel-kpi .fechar:hover { color: #e74c3c; }
        #painel-kpi .corpo { padding: 15px; }
        #painel-kpi .linha { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        #painel-kpi .rotulo { color: #666; }
        #painel-kpi .valor { font-weight: bold; color: #222; text-align: right; }
        .barra-fundo { background: #e0e0e0; border-radius: 4px; height: 8px; overflow: hidden; }
        .barra-preenchida { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.5s ease; }

        /* Legenda flutuante - canto inferior direito (status + comandos) */
        #hud-legenda { position: absolute !important; bottom: 15px !important; right: 15px !important; left: auto !important; z-index: 20; background: #252423; color: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); padding: 12px 16px; font-size: 12px; max-width: 230px; display: none; border-top: 4px solid #0078D4; }
        #hud-legenda h4 { margin: 0 0 8px 0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        #hud-legenda .legenda-cor-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        #hud-legenda .swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
        #hud-legenda .legenda-secao + .legenda-secao { margin-top: 12px; padding-top: 10px; border-top: 1px solid #444; }
        #hud-legenda .tecla { display: inline-block; background: #3a3a3a; border: 1px solid #555; border-radius: 4px; padding: 1px 7px; font-family: 'Consolas', monospace; font-weight: bold; margin-right: 3px; font-size: 11px; }

        /* Tela de carregamento */
        #tela-carregamento { position: fixed; inset: 0; background: #14161a; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; transition: opacity 0.7s ease; }
        #tela-carregamento.escondida { opacity: 0; pointer-events: none; }
        #tela-carregamento .spinner { width: 52px; height: 52px; border: 4px solid #2b2e33; border-top-color: #0078D4; border-radius: 50%; animation: girar-spinner 0.9s linear infinite; margin-bottom: 20px; }
        #tela-carregamento .texto-carregamento { font-size: 13px; letter-spacing: 2px; color: #888; text-transform: uppercase; }
        #tela-carregamento .pct-carregamento { font-size: 30px; font-weight: bold; margin-top: 8px; color: #fff; }
        @keyframes girar-spinner { to { transform: rotate(360deg); } }

        .btn-cinema { background: #16181c; border: 1px solid #444; }
        .btn-cinema.btn-toggle-ativo { background: #0078D4 !important; border-color: #0078D4; }
    </style>

    <!-- Bibliotecas Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>
    
    <!-- Tela de carregamento (fica na frente de tudo até o GLB terminar) -->
    <div id="tela-carregamento">
        <div class="spinner"></div>
        <div class="texto-carregamento">Carregando armazém 3D</div>
        <div class="pct-carregamento" id="pct-carregamento">0%</div>
    </div>

    <!-- Controles -->
    <div id="ui-controles">
        <button class="btn" id="btn-frente">Frente</button>
        <button class="btn" id="btn-topo">Topo</button>
        <button class="btn" id="btn-lado">Lado</button>
        <button class="btn btn-status" id="btn-status">Modo: Status (Desligado)</button>
        <button class="btn" id="btn-wasd">Visão: 1ª Pessoa</button>
        <button class="btn btn-cinema" id="btn-cinema">Modo Cinemático</button>
    </div>

    <!-- HUD Geral do Topo -->
    <div id="hud-topo">
        <div class="hud-box">
            <span class="titulo">Capacidade</span>
            <span class="valor" id="hud-cap">0</span>
        </div>
        <div class="hud-box">
            <span class="titulo">Estoque</span>
            <span class="valor" id="hud-est">0</span>
        </div>
        <div class="hud-box">
            <span class="titulo">Ocupação</span>
            <span class="valor" id="hud-pct">0%</span>
        </div>
        <div class="hud-box" style="border-left: 2px solid #555; padding-left: 20px;">
            <span class="titulo">Lidos do PBI</span>
            <span class="valor" id="hud-debug" style="color: #2ecc71;">0</span>
        </div>
        <div class="hud-box" style="border-left: 2px solid #555; padding-left: 20px;">
            <span class="titulo">Empilhadeira</span>
            <span class="valor" id="hud-emp" style="color: #f1c40f;">Inativa</span>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip"></div>

    <!-- Painel Lateral KPI -->
    <div id="painel-kpi">
        <div class="cabecalho">
            <span id="kpi-endereco">Endereço</span>
            <span class="fechar" id="kpi-fechar">&times;</span>
        </div>
        <div class="corpo">
            <div class="linha"><span class="rotulo">Produto</span><span class="valor" id="kpi-produto">-</span></div>
            <div class="linha"><span class="rotulo">Estoque</span><span class="valor" id="kpi-estoque">-</span></div>
            <div class="linha"><span class="rotulo">Capacidade</span><span class="valor" id="kpi-capacidade">-</span></div>
            <div class="linha"><span class="rotulo">Status</span><span class="valor" id="kpi-status">-</span></div>
            <div style="margin-top: 15px;">
                <div class="linha" style="margin-bottom: 2px;"><span class="rotulo">Ocupação</span><span class="valor" id="kpi-pct">0%</span></div>
                <div class="barra-fundo" style="margin-top: 5px;"><div class="barra-preenchida" id="kpi-barra"></div></div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Legenda flutuante: cores de status + comandos da visão 1ª pessoa -->
    <div id="hud-legenda">
        <div class="legenda-secao" id="legenda-status" style="display:none;">
            <h4>Legenda de Status</h4>
            <div class="legenda-cor-item"><span class="swatch" style="background:#2ecc71;"></span> Normal / OK</div>
            <div class="legenda-cor-item"><span class="swatch" style="background:#f1c40f;"></span> Estoque Baixo</div>
            <div class="legenda-cor-item"><span class="swatch" style="background:#e74c3c;"></span> Crítico</div>
        </div>
        <div class="legenda-secao" id="legenda-controles" style="display:none;">
            <h4>Controles (1ª Pessoa)</h4>
            <div style="margin-bottom:6px;"><span class="tecla">W</span><span class="tecla">A</span><span class="tecla">S</span><span class="tecla">D</span> mover</div>
            <div>Mouse (arrastar) — olhar ao redor</div>
        </div>
    </div>

    <script>
        // --- 1. ESTADO E COMUNICAÇÃO COM O POWER BI ---
        let dadosMap = {};
        let arrSelecionados = [];
        let modoStatusAtivo = false;

        function atualizarHUD(qtdLidos = 0) {
            let capTotal = 0, estTotal = 0;
            let objCount = 0;
            for (const key in dadosMap) {
                capTotal += Number(dadosMap[key].capacidade) || 0;
                estTotal += Number(dadosMap[key].estoque) || 0;
                objCount++;
            }
            document.getElementById('hud-cap').innerText = capTotal;
            document.getElementById('hud-est').innerText = estTotal;
            const pct = capTotal > 0 ? Math.round((estTotal / capTotal) * 100) : 0;
            document.getElementById('hud-pct').innerText = pct + '%';
            document.getElementById('hud-debug').innerText = objCount; 
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'dadosPowerBI') {
                
                let payload = event.data.dadosEstoque;
                if (typeof payload === 'string') {
                    try { payload = JSON.parse(payload); } catch(e) { console.warn("Erro ao ler JSON", e); }
                }

                dadosMap = {};
                let countLidos = 0;
                
                if (Array.isArray(payload)) {
                    payload.forEach(item => { 
                        const d = {};
                        for (let k in item) { d[k.toLowerCase()] = item[k]; }

                        const enderecoRaw = d['endereco'] || d['endereço'] || '';
                        
                        if(enderecoRaw) {
                            // Salva a string EXATAMENTE como vem do Power BI, só forçando maiúsculo
                            const endKey = enderecoRaw.toString().trim().toUpperCase();
                            
                            const extrairNum = (v) => {
                                if(v == null) return 0;
                                if(typeof v === 'number') return v;
                                const str = v.toString().replace(',', '.').replace(/[^\d.-]/g, '');
                                return parseFloat(str) || 0;
                            };

                            dadosMap[endKey] = {
                                originalName: enderecoRaw.toString(),
                                produto: d['produto'] || 'N/A',
                                estoque: extrairNum(d['estoque']),
                                capacidade: extrairNum(d['capacidade']),
                                status: (d['status'] || 'OK').toString().trim()
                            };
                            countLidos++;
                        }
                    });
                }
                
                let sel = event.data.selecionados;
                if (sel && typeof sel === 'string' && sel.trim() !== "") {
                    arrSelecionados = sel.split(',').map(s => s.trim().toUpperCase());
                } else {
                    arrSelecionados = [];
                }
                
                atualizarHUD(countLidos);
                aplicarFiltrosECores();
                atualizarEmpilhadeiraSelecao();
            }
        });

        // --- 2. CONFIGURAÇÃO DA CENA THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0d10); // cor escura fixa - troque o hex aqui pra ajustar o tom
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; 
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 150, 50);
        scene.add(dirLight);

        // --- 2C. TWEEN SUAVE DE CÂMERA (usado nos botões de visão e na entrada cinematográfica) ---
        let tweenCameraAtivo = null;
        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
        function tweenCamera(destPos, destTarget, duracaoMs, callback) {
            if (tweenCameraAtivo) tweenCameraAtivo.cancelado = true;
            const origemPos = camera.position.clone();
            const origemTarget = controls.target.clone();
            const inicio = performance.now();
            const estado = { cancelado: false };
            tweenCameraAtivo = estado;

            function passo(agora) {
                if (estado.cancelado) return;
                const t = Math.min((agora - inicio) / duracaoMs, 1);
                const te = easeInOutCubic(t);
                camera.position.lerpVectors(origemPos, destPos, te);
                controls.target.lerpVectors(origemTarget, destTarget, te);
                controls.update();
                if (t < 1) {
                    requestAnimationFrame(passo);
                } else {
                    if (tweenCameraAtivo === estado) tweenCameraAtivo = null;
                    if (callback) callback();
                }
            }
            requestAnimationFrame(passo);
        }

        let modeloGeral = null;
        let boxGeral = null;
        let centroGeral = new THREE.Vector3();
        let tamanhoMax = 0;
        let placasGeral = [];

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        const painelKPI = document.getElementById('painel-kpi');

        let modoWASD = false;
        const teclas = { w: false, a: false, s: false, d: false };

        // --- 3. CARREGANDO O MODELO GLTF ---
        const gltfUrl = 'https://raw.githubusercontent.com/EragonV7/Layout-3D-Teste/main/LAYOUT%20ESTOQUE%203D.glb';
        const loader = new THREE.GLTFLoader();
        
        loader.load(gltfUrl, function (gltf) {
            modeloGeral = gltf.scene; 
            scene.add(modeloGeral);
            
            boxGeral = new THREE.Box3().setFromObject(modeloGeral);
            centroGeral = boxGeral.getCenter(new THREE.Vector3());
            const size = boxGeral.getSize(new THREE.Vector3());
            tamanhoMax = Math.max(size.x, size.y, size.z);
            
            controls.target.copy(centroGeral);
            // Posição final (a mesma de sempre) - a câmera já nasce longe/de cima (ver mais abaixo)
            // e faz um tween suave até aqui, em vez de "teleportar" direto.
            const posFinalCamera = new THREE.Vector3(
                centroGeral.x + (tamanhoMax * 0.8),
                centroGeral.y + (tamanhoMax * 0.8),
                centroGeral.z + (tamanhoMax * 0.8)
            );
            camera.position.set(
                centroGeral.x + (tamanhoMax * 2.2),
                centroGeral.y + (tamanhoMax * 2.6),
                centroGeral.z + (tamanhoMax * 2.2)
            );
            controls.update();

            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    child.material = child.material.clone();
                    child.userData.corOriginal = child.material.color.getHex();
                }
            });

            criar3PlacasCorredor();
            calcularInfoCorredores();
            criarEmpilhadeiraGrupo();
            console.log('[EMP] Corredores detectados no GLB:', Object.keys(corredorInfo), corredorInfo);
            console.log('[EMP] Empilhadeira criada. Grupo:', empilhadeiraGrupo);
            aplicarFiltrosECores();

            // Esconde a tela de carregamento e faz a câmera "pousar" suavemente na posição inicial
            const telaCarregamento = document.getElementById('tela-carregamento');
            if (telaCarregamento) telaCarregamento.classList.add('escondida');
            tweenCamera(posFinalCamera, centroGeral.clone(), 2200);
        }, function (xhr) {
            const pctEl = document.getElementById('pct-carregamento');
            if (pctEl && xhr.total) {
                pctEl.innerText = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100)) + '%';
            }
        }, function (erro) {
            console.error('[VISUAL] Falha ao carregar o modelo 3D:', erro);
            const textoEl = document.querySelector('#tela-carregamento .texto-carregamento');
            if (textoEl) textoEl.innerText = 'Erro ao carregar o modelo 3D';
        });

        // --- 4. FUNÇÕES DE SUPORTE E LEITURA DE NOMES ---
        function corPorStatus(status) {
            const s = (status || '').toUpperCase();
            if (s === 'CRITICO' || s === 'CRÍTICO') return 0xe74c3c;
            if (s === 'BAIXO') return 0xf1c40f;
            return 0x2ecc71; 
        }

        // Pega o nome COMPLETO do objeto 3D se ele for uma prateleira
        function getEnderecoDaHierarquia(obj) { 
            let atual = obj; 
            while(atual) { 
                if (atual.name) {
                    const upper = atual.name.toUpperCase();
                    // Identifica se é prateleira se tiver o padrão A01-N01 no nome
                    if (upper.match(/([A-Z]\d{2}-N\d{2})/)) {
                        return upper;
                    }
                }
                atual = atual.parent; 
            } 
            return null; 
        }

        // Sistema Triplo de Busca de Dados (Garante que nunca vai falhar a ligação PBI <> 3D)
        function buscarDadosSeguro(nome3D) {
            if(!nome3D) return null;
            
            // 1. Tenta achar o nome exato
            if (dadosMap[nome3D]) return dadosMap[nome3D];

            // 2. Tenta achar por inclusão (se um nome está dentro do outro)
            for (let key in dadosMap) {
                if (key.includes(nome3D) || nome3D.includes(key)) {
                    return dadosMap[key];
                }
            }

            // 3. Tenta achar extraindo apenas o A01-N01 (Último recurso)
            const regex = /([A-Z]\d{2}-N\d{2})/;
            const match3D = nome3D.match(regex);
            if (match3D) {
                for (let key in dadosMap) {
                    const matchPBI = key.match(regex);
                    if (matchPBI && matchPBI[1] === match3D[1]) {
                        return dadosMap[key];
                    }
                }
            }

            return null;
        }

        // --- 5. APLICAR FILTROS (CORREÇÃO DO VISUAL) ---
        let meshesCriticos = [];

        function aplicarFiltrosECores() {
            if(!modeloGeral) return;
            meshesCriticos = [];
            
            modeloGeral.traverse(child => {
                if (!child.isMesh) return;
                
                const endFull = getEnderecoDaHierarquia(child);
                if (!endFull) return;

                let estaSelecionado = false;
                if (arrSelecionados.length === 0) {
                    estaSelecionado = true;
                } else {
                    // Busca refinada para filtros
                    const regex = /([A-Z]\d{2}-N\d{2})/;
                    const matchEnd = endFull.match(regex);
                    
                    estaSelecionado = arrSelecionados.some(sel => {
                        if (sel === endFull || endFull.includes(sel) || sel.includes(endFull)) return true;
                        const matchSel = sel.match(regex);
                        if (matchEnd && matchSel && matchEnd[1] === matchSel[1]) return true;
                        return false;
                    });
                }

                if (!estaSelecionado) {
                    child.material.transparent = true;
                    child.material.opacity = 0.12;
                    child.material.depthWrite = false;
                    child.material.color.setHex(0xdddddd); 
                } else {
                    child.material.transparent = false;
                    child.material.opacity = 1.0;
                    child.material.depthWrite = true;

                    const info = buscarDadosSeguro(endFull);

                    if (modoStatusAtivo && info) {
                        const corHex = corPorStatus(info.status);
                        child.material.color.setHex(corHex);
                        const statusUpper = (info.status || '').toUpperCase();
                        if (statusUpper === 'CRITICO' || statusUpper === 'CRÍTICO') {
                            if (!child.material.emissive) child.material.emissive = new THREE.Color(0x000000);
                            meshesCriticos.push(child);
                        }
                    } else {
                        if (child.userData.corOriginal !== undefined) {
                            child.material.color.setHex(child.userData.corOriginal);
                        }
                        if (child.material.emissive) child.material.emissive.setHex(0x000000);
                    }
                }
            });
        }

        // --- 6. GERAR APENAS 3 PLACAS (CORREDOR A, B, C) ---
        function criar3PlacasCorredor() {
            placasGeral.forEach(p => scene.remove(p));
            placasGeral = [];

            const dadosPorLetra = {
                'A': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity },
                'B': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity },
                'C': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity }
            };

            if (!modeloGeral) return;

            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    const end = getEnderecoDaHierarquia(child);
                    if (end) {
                        const match = end.match(/([A-Z])\d{2}-N\d{2}/);
                        if (match) {
                            const letra = match[1].toUpperCase(); 
                            if (dadosPorLetra[letra]) {
                                const pos = new THREE.Vector3();
                                child.getWorldPosition(pos);
                                dadosPorLetra[letra].soma.add(pos);
                                dadosPorLetra[letra].count++;

                                const box = new THREE.Box3().setFromObject(child);
                                if (box.max.y > dadosPorLetra[letra].maxY) {
                                    dadosPorLetra[letra].maxY = box.max.y;
                                }
                            }
                        }
                    }
                }
            });

            ['A', 'B', 'C'].forEach(letra => {
                const d = dadosPorLetra[letra];
                if (d.count > 0) {
                    const centro = d.soma.divideScalar(d.count);
                    const div = document.createElement('div');
                    div.className = 'placa-corredor';
                    div.innerText = `Corredor ${letra}`;

                    const placaCSS = new THREE.CSS2DObject(div);
                    placaCSS.position.set(centro.x, d.maxY + 3.0, centro.z);
                    scene.add(placaCSS);
                    placasGeral.push(placaCSS);
                }
            });
        }

        // --- 7. MOUSE, TOOLTIP E CLIQUE ---
        function atualizarPosicaoMouse(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

            atualizarPosicaoMouse(e);
            if (!modeloGeral) return;

                    if(matchVisual) tituloVisual = matchVisual[1];

                        <div class="tt-header">${tituloVisual}</div>
                        <div class="tt-line"><span class="tt-label">Produto</span><span class="tt-value">${info.produto}</span></div>
                        <div class="tt-line"><span class="tt-label">Estoque</span><span class="tt-value">${info.estoque}</span></div>

        function moverWASD() {
            if(!modoWASD) return;
            const vel = 0.4;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

            if(teclas.w) { camera.position.addScaledVector(dir, vel); controls.target.addScaledVector(dir, vel); }
            if(teclas.s) { camera.position.addScaledVector(dir, -vel); controls.target.addScaledVector(dir, -vel); }
            if(teclas.a) { camera.position.addScaledVector(side, vel); controls.target.addScaledVector(side, vel); }
            if(teclas.d) { camera.position.addScaledVector(side, -vel); controls.target.addScaledVector(side, -vel); }

            const chaoY = boxGeral ? boxGeral.min.y : 0;
            if (camera.position.y < chaoY + 1.8) {
                camera.position.y = chaoY + 1.8;
            }
        }

        // Calcula, para cada corredor (A, B, C...), a caixa delimitadora REAL no GLB
        // e define qual eixo é a direção de deslocamento (o maior lado da caixa)
        function calcularInfoCorredores() {
            corredorInfo = {};
            if (!modeloGeral) return;

            const caixasPorLetra = {};

            modeloGeral.traverse(child => {
                if (!child.isMesh) return;
                const end = getEnderecoDaHierarquia(child);
                if (!end) return;
                const match = end.match(/([A-Z])\d{2}-N\d{2}/);
                if (!match) return;
                const letra = match[1];

                if (!caixasPorLetra[letra]) caixasPorLetra[letra] = new THREE.Box3();
                caixasPorLetra[letra].union(new THREE.Box3().setFromObject(child));
            });

            for (const letra in caixasPorLetra) {
                const box = caixasPorLetra[letra];
                const centro = box.getCenter(new THREE.Vector3());
                const tamanho = box.getSize(new THREE.Vector3());
                const eixoDominante = tamanho.x >= tamanho.z ? 'x' : 'z';
                corredorInfo[letra] = { box, centro, tamanho, eixoDominante };
            }
        }

        // Acha a posição real (mundo) de um endereço específico (ex: "A01-N01") dentro do GLB
        // e calcula o ponto onde a empilhadeira deve parar SEM entrar na prateleira.
        function getPosicaoRealEndereco(enderecoCompleto) {
            if (!modeloGeral) return null;
            const boxEndereco = new THREE.Box3();
            let achou = false;

            const regexComparacao = /([A-Z]\d{2}-N\d{2})/;
            modeloGeral.traverse(child => {
                if (!child.isMesh) return;
                const endFull = getEnderecoDaHierarquia(child);
                if (!endFull) return;
                // O nome do objeto no GLB costuma vir com prefixo (ex: "IfcBuildingElementProxyA01-N01"),
                // então extraímos só o código do endereço pra comparar, em vez de comparar a string inteira.
                const m = endFull.match(regexComparacao);
                if (!m || m[1] !== enderecoCompleto) return;
                boxEndereco.union(new THREE.Box3().setFromObject(child));
                achou = true;
            });

            if (!achou) return null;

            const centro = boxEndereco.getCenter(new THREE.Vector3());
            const match = enderecoCompleto.match(/([A-Z])\d{2}-N\d{2}/);
            const letra = match ? match[1] : null;
            const info = letra ? corredorInfo[letra] : null;

            let alvoX = centro.x;
            let alvoZ = centro.z;

            if (info) {
                if (info.eixoDominante === 'z') {
                    alvoX = info.centro.x + (LADO_CORREDOR * (info.tamanho.x / 2 + MARGEM_LATERAL_CORREDOR));
                } else {
                    alvoZ = info.centro.z + (LADO_CORREDOR * (info.tamanho.z / 2 + MARGEM_LATERAL_CORREDOR));
                }
            }

            return {
                posAlvo: new THREE.Vector3(alvoX, chaoYReal + 0.05, alvoZ),
                pontoFrente: new THREE.Vector3(centro.x, chaoYReal + 0.05, centro.z),
                alturaGarfo: Math.max(0, (boxEndereco.min.y - chaoYReal)),
                eixoDominante: info ? info.eixoDominante : null
            };
        }

        // Chamada sempre que a seleção/filtro do Power BI mudar (via postMessage)
        function atualizarEmpilhadeiraSelecao() {
            const hudEmp = document.getElementById('hud-emp');
            console.log('[EMP] atualizarEmpilhadeiraSelecao chamada. modeloGeral pronto?', !!modeloGeral, '| empilhadeiraGrupo pronto?', !!empilhadeiraGrupo, '| arrSelecionados:', arrSelecionados);

            if (!modeloGeral || !empilhadeiraGrupo) {
                console.log('[EMP] Modelo ou empilhadeira ainda não carregados, abortando esta rodada.');
                return;
            }

            if (arrSelecionados.length < 1 || arrSelecionados.length > 3) {
                console.log('[EMP] Fora da faixa 1-3 selecionados (' + arrSelecionados.length + '), desativando.');
                desativarEmpilhadeira();
                if (hudEmp) hudEmp.innerText = 'Inativa';
                return;
            }

            const chaveNova = arrSelecionados.slice().sort().join('|');
            if (chaveNova === chaveFilaAtual && empilhadeiraAtiva) return; // mesma seleção, não reinicia o ciclo

            const novaFila = [];
            const regexEnd = /([A-Z]\d{2}-N\d{2})/;
            arrSelecionados.forEach(sel => {
                const m = sel.match(regexEnd);
                const enderecoNormalizado = m ? m[1] : sel;
                const pos = getPosicaoRealEndereco(enderecoNormalizado);
                console.log('[EMP] Endereço bruto:', sel, '| normalizado:', enderecoNormalizado, '| posição encontrada?', !!pos, pos);
                if (pos) novaFila.push({ endereco: enderecoNormalizado, ...pos });
            });

            if (novaFila.length === 0) {
                console.log('[EMP] Nenhum endereço da seleção foi encontrado no modelo 3D. Desativando.');
                desativarEmpilhadeira();
                if (hudEmp) hudEmp.innerText = 'Inativa';
                return;
            }

            filaEnderecosEmp = novaFila;
            chaveFilaAtual = chaveNova;
            indiceAlvoEmp = 0;
            empilhadeiraAtiva = true;
            empilhadeiraGrupo.visible = true;
            estadoEmp = 'ANDANDO';
            montarRotaEmp();
            console.log('[EMP] Empilhadeira ATIVADA com fila:', filaEnderecosEmp);
            if (hudEmp) hudEmp.innerText = 'Ativa (' + filaEnderecosEmp.length + ')';
        }

        function desativarEmpilhadeira() {
            empilhadeiraAtiva = false;
            filaEnderecosEmp = [];
            chaveFilaAtual = "";
            estadoEmp = 'PARADA';
            if (empilhadeiraGrupo) {
                // Fica VISÍVEL, estacionada no canto (não some mais)
                empilhadeiraGrupo.visible = true;
                empilhadeiraGrupo.rotation.y = 0;
                if (pontoEstacionamento) empilhadeiraGrupo.position.copy(pontoEstacionamento);
            }
            alturaAtualGarfoEmp = 0;
            if (empCarroMovel) empCarroMovel.position.y = 0;
            if (empTorreEstagio1) empTorreEstagio1.position.y = 0.95;
            if (empTorreEstagio2) empTorreEstagio2.position.y = 0.9;
            if (empGiroflex) empGiroflex.material.color.setHex(0x7a1f1f); // giroflex "desligado"
        }

        // Monta uma rota "em L": primeiro sai pelo corredor principal (fora de todas as
        // prateleiras) e só depois vira pra entrar no corredor específico do endereço alvo.
        // Isso evita que ela atravesse a prateleira andando na diagonal.
        function construirPontosRota(origem, alvoInfo) {
            const y = origem.y;
            let pontos;

            if (alvoInfo.eixoDominante === 'x' && pontoEstacionamento) {
                // Corredores correm no eixo X (lado a lado no Z) -> corredor principal fica no X do canto
                const laneX = pontoEstacionamento.x;
                pontos = [
                    origem.clone(),
                    new THREE.Vector3(laneX, y, origem.z),
                    new THREE.Vector3(laneX, y, alvoInfo.posAlvo.z),
                    alvoInfo.posAlvo.clone()
                ];
            } else if (alvoInfo.eixoDominante === 'z' && pontoEstacionamento) {
                // Corredores correm no eixo Z (lado a lado no X) -> corredor principal fica no Z do canto
                const laneZ = pontoEstacionamento.z;
                pontos = [
                    origem.clone(),
                    new THREE.Vector3(origem.x, y, laneZ),
                    new THREE.Vector3(alvoInfo.posAlvo.x, y, laneZ),
                    alvoInfo.posAlvo.clone()
                ];
            } else {
                pontos = [origem.clone(), alvoInfo.posAlvo.clone()];
            }

            // Remove pontos praticamente duplicados (evita segmento de comprimento zero)
            const limpos = [pontos[0]];
            for (let i = 1; i < pontos.length; i++) {
                if (pontos[i].distanceTo(limpos[limpos.length - 1]) > 0.05) limpos.push(pontos[i]);
            }
            if (limpos.length < 2) limpos.push(alvoInfo.posAlvo.clone());
            return limpos;
        }

        function calcularDistanciasAcumuladas(pontos) {
            const distancias = [0];
            for (let i = 1; i < pontos.length; i++) {
                distancias.push(distancias[i - 1] + pontos[i].distanceTo(pontos[i - 1]));
            }
            return distancias;
        }

        // Dado 0<=t<=1, devolve o ponto correspondente ao longo da rota (percorrendo os
        // segmentos em linha reta, sem "cortar caminho" entre eles)
        function pontoNaRota(rota, t) {
            const distanciaTotal = rota.distancias[rota.distancias.length - 1];
            const alvoDist = Math.min(Math.max(t, 0), 1) * distanciaTotal;
            for (let i = 1; i < rota.pontos.length; i++) {
                if (alvoDist <= rota.distancias[i] || i === rota.pontos.length - 1) {
                    const segLen = rota.distancias[i] - rota.distancias[i - 1];
                    const segT = segLen > 0 ? (alvoDist - rota.distancias[i - 1]) / segLen : 0;
                    return new THREE.Vector3().lerpVectors(rota.pontos[i - 1], rota.pontos[i], Math.min(Math.max(segT, 0), 1));
                }
            }
            return rota.pontos[rota.pontos.length - 1].clone();
        }

        function montarRotaEmp() {
            if (!empilhadeiraGrupo || filaEnderecosEmp.length === 0) return;
            const origem = empilhadeiraGrupo.position.clone();
            origem.y = chaoYReal + 0.05;
            const alvoInfo = filaEnderecosEmp[indiceAlvoEmp];
            const pontos = construirPontosRota(origem, alvoInfo);
            rotaEmpAtiva = { pontos, distancias: calcularDistanciasAcumuladas(pontos) };
            alturaAlvoGarfoEmp = alvoInfo.alturaGarfo;
            progressoEmp = 0;
        }

        function moverEmpilhadeira() {
            if (!empilhadeiraAtiva || !empilhadeiraGrupo || filaEnderecosEmp.length === 0) return;
            const alvo = filaEnderecosEmp[indiceAlvoEmp];

            if (estadoEmp === 'ANDANDO') {
                const distanciaTotal = rotaEmpAtiva ? rotaEmpAtiva.distancias[rotaEmpAtiva.distancias.length - 1] : 0;
                const incremento = distanciaTotal > 0 ? (VELOCIDADE_EMP / distanciaTotal) : 1;
                progressoEmp += incremento;
                if (progressoEmp >= 1) {
                    progressoEmp = 1;
                    empilhadeiraGrupo.position.copy(alvo.posAlvo);
                    estadoEmp = 'GIRANDO';
                    const dir = new THREE.Vector3().subVectors(alvo.pontoFrente, empilhadeiraGrupo.position);
                    anguloAlvoYEmp = Math.atan2(dir.x, dir.z);
                } else {
                    const p = pontoNaRota(rotaEmpAtiva, progressoEmp);
                    const prox = pontoNaRota(rotaEmpAtiva, Math.min(progressoEmp + 0.01, 1));
                    empilhadeiraGrupo.position.copy(p);
                    if (prox.distanceTo(p) > 0.001) empilhadeiraGrupo.lookAt(prox);
                    anguloAtualYEmp = empilhadeiraGrupo.rotation.y;
                }
            }
            else if (estadoEmp === 'GIRANDO') {
                anguloAtualYEmp = THREE.MathUtils.lerp(anguloAtualYEmp, anguloAlvoYEmp, 0.08);
                empilhadeiraGrupo.rotation.y = anguloAtualYEmp;
                if (Math.abs(anguloAtualYEmp - anguloAlvoYEmp) < 0.02) {
                    estadoEmp = 'SUBINDO';
                }
            }
            else if (estadoEmp === 'SUBINDO') {
                alturaAtualGarfoEmp = THREE.MathUtils.lerp(alturaAtualGarfoEmp, alturaAlvoGarfoEmp, 0.05);
                if (Math.abs(alturaAtualGarfoEmp - alturaAlvoGarfoEmp) < 0.05) {
                    alturaAtualGarfoEmp = alturaAlvoGarfoEmp;
                    estadoEmp = 'ESPERANDO';
                    tempoEsperaEmp = 0;
                }
            }
            else if (estadoEmp === 'ESPERANDO') {
                tempoEsperaEmp++;
                if (tempoEsperaEmp > 120) {
                    estadoEmp = 'DESCENDO';
                }
            }
            else if (estadoEmp === 'DESCENDO') {
                alturaAtualGarfoEmp = THREE.MathUtils.lerp(alturaAtualGarfoEmp, 0, 0.05);
                if (Math.abs(alturaAtualGarfoEmp) < 0.05) {
                    alturaAtualGarfoEmp = 0;
                    indiceAlvoEmp = (indiceAlvoEmp + 1) % filaEnderecosEmp.length;
                    estadoEmp = 'ANDANDO';
                    montarRotaEmp();
                }
            }

            if (empCarroMovel) empCarroMovel.position.y = alturaAtualGarfoEmp;
            if (empTorreEstagio1) empTorreEstagio1.position.y = 0.95 + (alturaAtualGarfoEmp * 0.33);
            if (empTorreEstagio2) empTorreEstagio2.position.y = 0.9 + (alturaAtualGarfoEmp * 0.66);

            if (empGiroflex) {
                const piscaLigado = Math.floor(Date.now() / 200) % 2 === 0;
                empGiroflex.material.color.setHex(piscaLigado ? 0xff4757 : 0xfffa65);
            }
        }

        // Atalho de teste manual: abra o link do GitHub Pages direto no navegador (sem Power BI),
        // espere o armazém 3D carregar, abra o Console (F12) e rode, por exemplo:
        //   testarEmpilhadeira(["A01-N01"])
        window.testarEmpilhadeira = function(lista) {
            arrSelecionados = lista.map(s => s.toUpperCase());
            console.log('[EMP][TESTE MANUAL] Simulando seleção:', arrSelecionados);
            atualizarEmpilhadeiraSelecao();
        };

        // Pulso suave nos itens com status crítico (emissive oscilando) - só roda quando existe algum
        function pulsarCriticos(tempo) {
            if (meshesCriticos.length === 0) return;
            const intensidade = (Math.sin(tempo / 300) + 1) / 2 * 0.6; // 0 a 0.6
            for (let i = 0; i < meshesCriticos.length; i++) {
                const mesh = meshesCriticos[i];
                if (mesh.material && mesh.material.emissive) {
                    mesh.material.emissive.setRGB(intensidade, 0, 0);
                }
            }
        }

        // --- 9. LOOP DE ANIMAÇÃO ---
        function animate(tempo) {
            requestAnimationFrame(animate);
            moverWASD();
            moverEmpilhadeira();
            pulsarCriticos(tempo || 0);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
