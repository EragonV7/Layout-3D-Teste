<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 3D - Power BI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f4f4f4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        
        /* Painel de Controles (Câmeras e Status) */
        #ui-controles { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; max-width: 420px; }
        .btn { background: #252423; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 13px; transition: background 0.3s, transform 0.1s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn:hover { background: #0078D4; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-toggle-ativo { background: #107c41 !important; } 
        .btn-status { background: #8e44ad; } 

        /* HUD Global (Topo Centro) */
        #hud-topo { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: #252423; display: flex; gap: 25px; padding: 12px 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 20; border-bottom: 4px solid #0078D4; }
        .hud-box { text-align: center; color: #fff; min-width: 80px; }
        .hud-box .titulo { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; font-weight: bold; }
        .hud-box .valor { font-size: 20px; font-weight: bold; }

        /* Placas de Corredor (CSS2D) - Apenas 3 Placas */
        .placa-corredor { background: rgba(0, 0, 0, 0.85); color: #ffffff; padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 16px; border: 2px solid #0078D4; pointer-events: none; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }

        /* Tooltip Flutuante (Estilo Claro como na imagem) */
        #tooltip { position: absolute; background: #ffffff; color: #333; padding: 12px 16px; border-radius: 6px; display: none; pointer-events: none; z-index: 9999; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); border-top: 4px solid #0078D4; min-width: 170px; }
        .tt-header { font-weight: bold; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; color: #0078D4; }
        .tt-line { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .tt-label { color: #666; }
        .tt-value { font-weight: bold; color: #111; text-align: right; margin-left: 20px; }

        /* Painel Lateral KPI (Ao clicar na prateleira) */
        #painel-kpi { position: absolute; top: 15px; right: 15px; width: 280px; z-index: 30; background: #ffffff; border-radius: 8px; box-shadow: 0px 8px 25px rgba(0,0,0,0.3); display: none; overflow: hidden; border-top: 4px solid #0078D4; }
        #painel-kpi .cabecalho { background: #f8f9fa; color: #333; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; border-bottom: 1px solid #eee; }
        #painel-kpi .fechar { cursor: pointer; font-size: 20px; color: #999; line-height: 1; }
        #painel-kpi .fechar:hover { color: #e74c3c; }
        #painel-kpi .corpo { padding: 15px; }
        #painel-kpi .linha { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        #painel-kpi .rotulo { color: #666; }
        #painel-kpi .valor { font-weight: bold; color: #222; text-align: right; }
        .barra-fundo { background: #e0e0e0; border-radius: 4px; height: 8px; overflow: hidden; }
        .barra-preenchida { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.5s ease; }
    </style>

    <!-- Bibliotecas Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>
    
    <!-- Controles -->
    <div id="ui-controles">
        <button class="btn" id="btn-frente">Frente</button>
        <button class="btn" id="btn-topo">Topo</button>
        <button class="btn" id="btn-lado">Lado</button>
        <button class="btn btn-status" id="btn-status">Modo: Status (Desligado)</button>
        <button class="btn" id="btn-wasd">Visão: 1ª Pessoa</button>
    </div>

    <!-- HUD Geral do Topo -->
    <div id="hud-topo">
        <div class="hud-box">
            <span class="titulo">Capacidade</span>
            <span class="valor" id="hud-cap">0</span>
        </div>
        <div class="hud-box">
            <span class="titulo">Estoque</span>
            <span class="valor" id="hud-est">0</span>
        </div>
        <div class="hud-box">
            <span class="titulo">Ocupação</span>
            <span class="valor" id="hud-pct">0%</span>
        </div>
        <!-- Contador de Registros Lidos para facilitar seu diagnóstico -->
        <div class="hud-box" style="border-left: 2px solid #555; padding-left: 20px;">
            <span class="titulo">Lidos do PBI</span>
            <span class="valor" id="hud-debug" style="color: #2ecc71;">0</span>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip"></div>

    <!-- Painel Lateral KPI -->
    <div id="painel-kpi">
        <div class="cabecalho">
            <span id="kpi-endereco">Endereço</span>
            <span class="fechar" id="kpi-fechar">&times;</span>
        </div>
        <div class="corpo">
            <div class="linha"><span class="rotulo">Produto</span><span class="valor" id="kpi-produto">-</span></div>
            <div class="linha"><span class="rotulo">Estoque</span><span class="valor" id="kpi-estoque">-</span></div>
            <div class="linha"><span class="rotulo">Capacidade</span><span class="valor" id="kpi-capacidade">-</span></div>
            <div class="linha"><span class="rotulo">Status</span><span class="valor" id="kpi-status">-</span></div>
            <div style="margin-top: 15px;">
                <div class="linha" style="margin-bottom: 2px;"><span class="rotulo">Ocupação</span><span class="valor" id="kpi-pct">0%</span></div>
                <div class="barra-fundo" style="margin-top: 5px;"><div class="barra-preenchida" id="kpi-barra"></div></div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. ESTADO E COMUNICAÇÃO COM O POWER BI ---
        let dadosMap = {};
        let arrSelecionados = [];
        let modoStatusAtivo = false;

        // Atualiza os valores do HUD do Topo
        function atualizarHUD(qtdLidos = 0) {
            let capTotal = 0, estTotal = 0;
            let objCount = 0;
            for (const key in dadosMap) {
                capTotal += Number(dadosMap[key].capacidade) || 0;
                estTotal += Number(dadosMap[key].estoque) || 0;
                objCount++;
            }
            document.getElementById('hud-cap').innerText = capTotal;
            document.getElementById('hud-est').innerText = estTotal;
            const pct = capTotal > 0 ? Math.round((estTotal / capTotal) * 100) : 0;
            document.getElementById('hud-pct').innerText = pct + '%';
            document.getElementById('hud-debug').innerText = objCount; // Atualiza a contagem visual
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'dadosPowerBI') {
                
                let payload = event.data.dadosEstoque;
                
                // Conversão forçada se vier como string do iframe
                if (typeof payload === 'string') {
                    try { payload = JSON.parse(payload); } catch(e) { console.warn("Erro ao ler JSON", e); }
                }

                dadosMap = {};
                let countLidos = 0;
                
                // LEITURA BLINDADA (Ignora maiúsculas/minúsculas e força números)
                if (Array.isArray(payload)) {
                    payload.forEach(item => { 
                        // Transforma todas as chaves em minúsculas para não dar erro
                        const d = {};
                        for (let k in item) { d[k.toLowerCase()] = item[k]; }

                        const enderecoRaw = d['endereco'] || d['endereço'] || '';
                        
                        if(enderecoRaw) {
                            // Limpa qualquer espaço em branco acidental do DAX e joga pra maiúscula (ex: 'A01-N01')
                            const endKey = enderecoRaw.toString().replace(/\s/g, '').toUpperCase();
                            
                            // Função que garante que estoques e capacidades virem números reais
                            const extrairNum = (v) => {
                                if(v == null) return 0;
                                if(typeof v === 'number') return v;
                                const str = v.toString().replace(',', '.').replace(/[^\d.-]/g, '');
                                return parseFloat(str) || 0;
                            };

                            dadosMap[endKey] = {
                                produto: d['produto'] || 'N/A',
                                estoque: extrairNum(d['estoque']),
                                capacidade: extrairNum(d['capacidade']),
                                status: (d['status'] || 'OK').toString().trim()
                            };
                            countLidos++;
                        }
                    });
                }
                
                let sel = event.data.selecionados;
                if (sel && typeof sel === 'string' && sel.trim() !== "") {
                    arrSelecionados = sel.split(',').map(s => s.trim().toUpperCase());
                } else {
                    arrSelecionados = [];
                }
                
                atualizarHUD(countLidos);
                aplicarFiltrosECores();
            }
        });

        // --- 2. CONFIGURAÇÃO DA CENA THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f4f4);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // Garante que o CSS2D não trava cliques do mouse
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 150, 50);
        scene.add(dirLight);

        let modeloGeral = null;
        let boxGeral = null;
        let centroGeral = new THREE.Vector3();
        let tamanhoMax = 0;
        let placasGeral = [];

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        const painelKPI = document.getElementById('painel-kpi');

        // Movimentação WASD
        let modoWASD = false;
        const teclas = { w: false, a: false, s: false, d: false };

        // --- 3. CARREGANDO O MODELO GLTF ---
        const gltfUrl = 'https://raw.githubusercontent.com/EragonV7/Layout-3D-Teste/main/LAYOUT%20ESTOQUE%203D.glb';
        const loader = new THREE.GLTFLoader();
        
        loader.load(gltfUrl, function (gltf) {
            modeloGeral = gltf.scene; 
            scene.add(modeloGeral);
            
            boxGeral = new THREE.Box3().setFromObject(modeloGeral);
            centroGeral = boxGeral.getCenter(new THREE.Vector3());
            const size = boxGeral.getSize(new THREE.Vector3());
            tamanhoMax = Math.max(size.x, size.y, size.z);
            
            controls.target.copy(centroGeral);
            camera.position.set(centroGeral.x + (tamanhoMax * 0.8), centroGeral.y + (tamanhoMax * 0.8), centroGeral.z + (tamanhoMax * 0.8));
            controls.update();

            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    child.material = child.material.clone();
                    child.userData.corOriginal = child.material.color.getHex();
                }
            });

            criar3PlacasCorredor();
            aplicarFiltrosECores();
        });

        // --- 4. FUNÇÕES DE SUPORTE E LEITURA DE NOMES ---
        function corPorStatus(status) {
            const s = (status || '').toUpperCase();
            if (s === 'CRITICO' || s === 'CRÍTICO') return 0xe74c3c;
            if (s === 'BAIXO') return 0xf1c40f;
            return 0x2ecc71; 
        }

        function extrairEndereco(nome) { 
            if (!nome) return null;
            const m = nome.toUpperCase().match(/([A-Z]\d{2}-N\d{2})/); 
            if (m) return m[1];
            return null; 
        }

        function getEnderecoDaHierarquia(obj) { 
            let atual = obj; 
            while(atual) { 
                const end = extrairEndereco(atual.name); 
                if (end) return end; 
                atual = atual.parent; 
            } 
            return null; 
        }

        // --- 5. APLICAR FILTROS (CORREÇÃO DO VISUAL TRANSPARENTE ZUADO) ---
        function aplicarFiltrosECores() {
            if(!modeloGeral) return;
            
            modeloGeral.traverse(child => {
                if (!child.isMesh) return;
                
                const end = getEnderecoDaHierarquia(child);
                if (!end) return;

                const endUpper = end.toUpperCase();
                const estaSelecionado = arrSelecionados.length === 0 || arrSelecionados.some(sel => sel.includes(endUpper) || endUpper.includes(sel));

                if (!estaSelecionado) {
                    // Limpeza visual: Prateleiras não selecionadas perdem o conflito de z-index
                    child.material.transparent = true;
                    child.material.opacity = 0.12;
                    child.material.depthWrite = false;
                    child.material.color.setHex(0xdddddd); 
                } else {
                    child.material.transparent = false;
                    child.material.opacity = 1.0;
                    child.material.depthWrite = true;

                    if (modoStatusAtivo && dadosMap[endUpper]) {
                        const corHex = corPorStatus(dadosMap[endUpper].status);
                        child.material.color.setHex(corHex);
                    } else {
                        if (child.userData.corOriginal !== undefined) {
                            child.material.color.setHex(child.userData.corOriginal);
                        }
                    }
                }
            });
        }

        // --- 6. GERAR APENAS 3 PLACAS (CORREDOR A, B, C) ---
        function criar3PlacasCorredor() {
            placasGeral.forEach(p => scene.remove(p));
            placasGeral = [];

            const dadosPorLetra = {
                'A': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity },
                'B': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity },
                'C': { soma: new THREE.Vector3(), count: 0, maxY: -Infinity }
            };

            if (!modeloGeral) return;

            modeloGeral.traverse(child => {
                if (child.isMesh) {
                    const end = getEnderecoDaHierarquia(child);
                    if (end) {
                        const letra = end.charAt(0).toUpperCase(); 
                        if (dadosPorLetra[letra]) {
                            const pos = new THREE.Vector3();
                            child.getWorldPosition(pos);
                            dadosPorLetra[letra].soma.add(pos);
                            dadosPorLetra[letra].count++;

                            const box = new THREE.Box3().setFromObject(child);
                            if (box.max.y > dadosPorLetra[letra].maxY) {
                                dadosPorLetra[letra].maxY = box.max.y;
                            }
                        }
                    }
                }
            });

            ['A', 'B', 'C'].forEach(letra => {
                const d = dadosPorLetra[letra];
                if (d.count > 0) {
                    const centro = d.soma.divideScalar(d.count);
                    const div = document.createElement('div');
                    div.className = 'placa-corredor';
                    div.innerText = `Corredor ${letra}`;

                    const placaCSS = new THREE.CSS2DObject(div);
                    placaCSS.position.set(centro.x, d.maxY + 3.0, centro.z);
                    scene.add(placaCSS);
                    placasGeral.push(placaCSS);
                }
            });
        }

        // --- 7. MOUSE, TOOLTIP E CLIQUE ---
        function atualizarPosicaoMouse(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

        window.addEventListener('mousemove', (e) => {
            atualizarPosicaoMouse(e);
            if (!modeloGeral) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modeloGeral.children, true);

            if (intersects.length > 0) {
                let end = null;
                for (let i = 0; i < intersects.length; i++) {
                    end = getEnderecoDaHierarquia(intersects[i].object);
                    if (end) break;
                }

                if (end) {
                    const endFormatado = end.toUpperCase();
                    // Busca na memória baseada na chave limpa do endereço
                    const info = dadosMap[endFormatado] || { produto: 'N/A', estoque: 0, capacidade: 0, status: 'Sem Info' };
                    
                    const cap = Number(info.capacidade) || 0;
                    const est = Number(info.estoque) || 0;
                    const pct = cap > 0 ? Math.round((est / cap) * 100) : 0;
                    const corBarra = pct > 90 ? '#e74c3c' : (pct > 50 ? '#f1c40f' : '#2ecc71');

                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                    
                    // Tooltip reconstruído idêntico ao da imagem
                    tooltip.innerHTML = `
                        <div class="tt-header">${endFormatado}</div>
                        <div class="tt-line"><span class="tt-label">Produto</span><span class="tt-value">${info.produto}</span></div>
                        <div class="tt-line"><span class="tt-label">Estoque</span><span class="tt-value">${info.estoque}</span></div>
                        <div class="tt-line"><span class="tt-label">Capacidade</span><span class="tt-value">${info.capacidade}</span></div>
                        <div class="tt-line"><span class="tt-label">Status</span><span class="tt-value">${info.status}</span></div>
                        <div class="tt-line" style="margin-top: 10px;"><span class="tt-label">Ocupação</span><span class="tt-value">${pct}%</span></div>
                        <div class="barra-fundo" style="margin-top: 2px;"><div class="barra-preenchida" style="width: ${Math.min(pct, 100)}%; background: ${corBarra}"></div></div>
                    `;
                } else {
                    tooltip.style.display = 'none';
                }
            } else {
                tooltip.style.display = 'none';
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('#ui-controles') || e.target.closest('#painel-kpi') || e.target.closest('#hud-topo')) return;
            if (!modeloGeral) return;

            atualizarPosicaoMouse(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(modeloGeral.children, true);

            if (intersects.length > 0) {
                let end = null;
                for (let i = 0; i < intersects.length; i++) {
                    end = getEnderecoDaHierarquia(intersects[i].object);
                    if (end) break;
                }

                if (end) {
                    exibirKPI(end.toUpperCase(), dadosMap[end.toUpperCase()] || {});
                }
            }
        });

        function exibirKPI(endereco, d) {
            document.getElementById('kpi-endereco').innerText = endereco;
            document.getElementById('kpi-produto').innerText = d.produto || 'N/A';
            document.getElementById('kpi-estoque').innerText = d.estoque ?? 0;
            document.getElementById('kpi-capacidade').innerText = d.capacidade ?? 0;
            document.getElementById('kpi-status').innerText = d.status || 'N/A';

            const cap = Number(d.capacidade) || 0;
            const est = Number(d.estoque) || 0;
            const pct = cap > 0 ? Math.round((est / cap) * 100) : 0;

            document.getElementById('kpi-pct').innerText = pct + '%';
            const barra = document.getElementById('kpi-barra');
            barra.style.width = Math.min(pct, 100) + '%';
            barra.style.background = pct > 90 ? '#e74c3c' : (pct > 50 ? '#f1c40f' : '#2ecc71');

            painelKPI.style.display = 'block';
        }

        document.getElementById('kpi-fechar').addEventListener('click', () => {
            painelKPI.style.display = 'none';
        });

        // --- 8. CONTROLES DE VISÃO E MOVIMENTO (WASD & BOTÕES) ---
        document.getElementById('btn-status').addEventListener('click', function() {
            modoStatusAtivo = !modoStatusAtivo;
            this.innerText = modoStatusAtivo ? 'Modo: Status (Ligado)' : 'Modo: Status (Desligado)';
            this.style.background = modoStatusAtivo ? '#107c41' : '#8e44ad';
            aplicarFiltrosECores();
        });

        document.getElementById('btn-frente').addEventListener('click', () => {
            if(!centroGeral) return;
            camera.position.set(centroGeral.x, centroGeral.y + (tamanhoMax * 0.2), centroGeral.z + (tamanhoMax * 1.2));
            controls.target.copy(centroGeral);
            controls.update();
        });

        document.getElementById('btn-topo').addEventListener('click', () => {
            if(!centroGeral) return;
            camera.position.set(centroGeral.x, centroGeral.y + (tamanhoMax * 1.5), centroGeral.z + 0.1);
            controls.target.copy(centroGeral);
            controls.update();
        });

        document.getElementById('btn-lado').addEventListener('click', () => {
            if(!centroGeral) return;
            camera.position.set(centroGeral.x + (tamanhoMax * 1.2), centroGeral.y + (tamanhoMax * 0.2), centroGeral.z);
            controls.target.copy(centroGeral);
            controls.update();
        });

        // Controle WASD
        const btnWASD = document.getElementById('btn-wasd');
        btnWASD.addEventListener('click', () => {
            modoWASD = !modoWASD;
            if(modoWASD) {
                btnWASD.classList.add('btn-toggle-ativo');
                btnWASD.innerText = 'Visão: 1ª Pessoa (ON)';
                const chaoY = boxGeral ? boxGeral.min.y : 0;
                camera.position.set(centroGeral.x, chaoY + 1.8, centroGeral.z + (tamanhoMax * 0.3));
                controls.target.set(centroGeral.x, chaoY + 1.8, centroGeral.z);
            } else {
                btnWASD.classList.remove('btn-toggle-ativo');
                btnWASD.innerText = 'Visão: 1ª Pessoa';
                camera.position.set(centroGeral.x + (tamanhoMax * 0.8), centroGeral.y + (tamanhoMax * 0.8), centroGeral.z + (tamanhoMax * 0.8));
                controls.target.copy(centroGeral);
            }
            controls.update();
        });

        window.addEventListener('keydown', (e) => {
            if(!modoWASD) return;
            const k = e.key.toLowerCase();
            if (teclas.hasOwnProperty(k)) teclas[k] = true;
        });

        window.addEventListener('keyup', (e) => {
            if(!modoWASD) return;
            const k = e.key.toLowerCase();
            if (teclas.hasOwnProperty(k)) teclas[k] = false;
        });

        function moverWASD() {
            if(!modoWASD) return;
            const vel = 0.4;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

            if(teclas.w) { camera.position.addScaledVector(dir, vel); controls.target.addScaledVector(dir, vel); }
            if(teclas.s) { camera.position.addScaledVector(dir, -vel); controls.target.addScaledVector(dir, -vel); }
            if(teclas.a) { camera.position.addScaledVector(side, vel); controls.target.addScaledVector(side, vel); }
            if(teclas.d) { camera.position.addScaledVector(side, -vel); controls.target.addScaledVector(side, -vel); }

            const chaoY = boxGeral ? boxGeral.min.y : 0;
            if (camera.position.y < chaoY + 1.8) {
                camera.position.y = chaoY + 1.8;
            }
        }

        // --- 9. LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);
            moverWASD();
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
