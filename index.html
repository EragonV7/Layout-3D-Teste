<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='UTF-8'>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #botoes-camera { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 5px; flex-wrap: wrap; max-width: 400px; }
        .btn { background: #252423; color: #fff; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px; transition: background 0.3s ease; }
        .btn:hover { background: #0078D4; }
        #btn-modo { background: #8e44ad; }
        #btn-modo:hover { background: #9b59b6; }
        #btn-fps { background: #16a085; }
        #btn-fps:hover { background: #1abc9c; }
        #hud-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.95); padding: 12px 24px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 40; display: flex; gap: 30px; border-top: 4px solid #0078D4; align-items: flex-start; }
        .hud-item { text-align: center; min-width: 120px; }
        .hud-titulo { font-size: 11px; color: #6b6b6b; text-transform: uppercase; font-weight: 700; }
        .hud-valor { font-size: 22px; color: #252423; font-weight: 800; margin-top: 4px; }
        .hud-progress-bg { width: 100%; height: 6px; background-color: #e0e0e0; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .hud-progress-bar { height: 100%; width: 0%; border-radius: 4px; transition: width 1s ease; }
        #aviso-fps { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 12px; z-index: 50; display: none; }
        #tooltip { position: absolute; background: rgba(0, 0, 0, 0.9); color: #fff; padding: 8px 12px; border-radius: 4px; display: none; pointer-events: none; z-index: 9999; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #legenda { position: absolute; bottom: 15px; left: 15px; z-index: 10; background: rgba(255,255,255,0.92); padding: 10px 14px; border-radius: 6px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #legenda .item { display: flex; align-items: center; margin-bottom: 4px; }
        #legenda .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; display: inline-block; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id='botoes-camera'>
        <button class='btn' id='btn-frente'>Frente</button>
        <button class='btn' id='btn-topo'>Topo</button>
        <button class='btn' id='btn-lado'>Lado</button>
        <!-- Mantive os botões abaixo caso queira expandir depois, por enquanto focam a câmera -->
        <button class='btn' id='btn-modo'>Modo: Status</button>
        <button class='btn' id='btn-fps'>Visão: 1ª Pessoa</button>
    </div>

    <div id='hud-container'>
        <div class='hud-item'>
            <div class='hud-titulo'>Ocupação Global</div>
            <div class='hud-valor' id='hud-ocupacao'>--%</div>
            <div class='hud-progress-bg'><div class='hud-progress-bar' id='hud-ocupacao-bar'></div></div>
        </div>
        <div class='hud-item' style='display: flex; flex-direction: column; justify-content: center;'>
            <div class='hud-titulo'>Posições Mapeadas</div>
            <div class='hud-valor' id='hud-posicoes'>--</div>
        </div>
    </div>

    <div id='aviso-fps'>🚶 <b>Modo Pedestre Ativo</b><br>• Use WASD/Setas para caminhar.<br>• Clique e arraste para olhar.</div>
    
    <div id='legenda'>
        <div id='legenda-status'>
            <div class='item'><span class='dot' style='background:#2ecc71'></span>OK</div>
            <div class='item'><span class='dot' style='background:#f1c40f'></span>Baixo</div>
            <div class='item'><span class='dot' style='background:#e74c3c'></span>Crítico</div>
        </div>
    </div>
    
    <div id='tooltip'></div>
    <div id='canvas-container'></div>

    <script type='module'>
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        let modeloGeral = null;
        let centroGeral = new THREE.Vector3();
        let tamanhoMax = 0;
        let chaoY = 0;
        let gruposGerais = {}; 
        const objetosCriticos = [];

        let dadosEstoque = [];
        let dadosMap = {};
        let listaSelecionadosLimpos = [];

        window.addEventListener('message', function(event) {
            if (event.data && event.data.tipo === 'dadosPowerBI') {
                dadosEstoque = event.data.dadosEstoque;
                const textoSelecionados = event.data.selecionados || '';
                const listaSel = textoSelecionados !== '' ? textoSelecionados.split(',').map(s => s.trim()) : [];
                listaSelecionadosLimpos = listaSel.map(s => extrairEndereco(s) || s);

                processarDados();
                if (modeloGeral) atualizarCoresEVisibilidade();
            }
        });

        function toNumber(val) { return parseFloat(val?.toString().replace(',', '.')) || 0; }
        function extrairEndereco(nome) { const m = nome?.toUpperCase().match(/([A-Z]\d{2}-N\d{2})/); return m ? m[1] : null; }
        function getEnderecoDaHierarquia(obj) { let atual = obj; while(atual) { const end = extrairEndereco(atual.name); if (end) return end; atual = atual.parent; } return null; }

        function processarDados() {
            let totalEstoque = 0; let totalCap = 0; let count = 0;
            dadosEstoque.forEach(d => { 
                const endLimpo = extrairEndereco(d.endereco) || d.endereco;
                dadosMap[endLimpo] = d; 
                totalEstoque += toNumber(d.estoque);
                totalCap += toNumber(d.capacidade);
                count++;
            });

            const ocupacao = totalCap > 0 ? ((totalEstoque / totalCap) * 100).toFixed(1) : 0;
            let corHUD = ocupacao >= 80 ? '#e74c3c' : (ocupacao >= 50 ? '#f39c12' : '#2ecc71');

            document.getElementById('hud-ocupacao').innerText = ocupacao + '%';
            document.getElementById('hud-ocupacao').style.color = corHUD;
            document.getElementById('hud-ocupacao-bar').style.width = Math.min(ocupacao, 100) + '%';
            document.getElementById('hud-ocupacao-bar').style.backgroundColor = corHUD;
            document.getElementById('hud-posicoes').innerText = count;
        }

        function corPorStatus(status) {
            const s = (status || '').toUpperCase();
            if (s === 'CRITICO' || s === 'CRÍTICO') return 0xe74c3c;
            if (s === 'BAIXO') return 0xf1c40f;
            return 0x2ecc71; 
        }

        function applyMaterialColor(mesh, hexColor) {
            if (!mesh.material) return;
            mesh.material = Array.isArray(mesh.material) ? mesh.material.map(m => { const nm = m.clone(); if(nm.color) nm.color.setHex(hexColor); return nm; }) : (() => { const m = mesh.material.clone(); if(m.color) m.color.setHex(hexColor); return m; })();
        }

        function applyEmissive(mesh, hexColor, intensity) {
            if (!mesh.material) return;
            if (Array.isArray(mesh.material)) { mesh.material.forEach(m => { if(m.emissive) { m.emissive.setHex(hexColor); m.emissiveIntensity = intensity; }}); }
            else { if(mesh.material.emissive) { mesh.material.emissive.setHex(hexColor); mesh.material.emissiveIntensity = intensity; } }
        }

        function atualizarCoresEVisibilidade() {
            objetosCriticos.length = 0; 
            Object.keys(dadosMap).forEach(endLimpo => {
                const dado = dadosMap[endLimpo];
                const meshes = gruposGerais[endLimpo];
                if (!meshes) return;

                const cor = corPorStatus(dado.status);
                const ehCritico = (dado.status.toUpperCase() === 'CRITICO');

                meshes.forEach(m => {
                    applyMaterialColor(m, cor);
                    if (ehCritico) objetosCriticos.push(m);
                    if (listaSelecionadosLimpos.includes(endLimpo)) applyEmissive(m, 0xffffff, 0.6);
                    else applyEmissive(m, 0x000000, 0);
                });
            });
        }

        const loader = new GLTFLoader();
        loader.load(
            'LAYOUT ESTOQUE 3D.glb', 
            function (gltf) {
                modeloGeral = gltf.scene;
                scene.add(modeloGeral);

                const box = new THREE.Box3().setFromObject(modeloGeral);
                box.getCenter(centroGeral);
                chaoY = box.min.y;
                tamanhoMax = Math.max(...box.getSize(new THREE.Vector3()).toArray());

                controls.target.copy(centroGeral);
                camera.position.set(centroGeral.x + tamanhoMax/2, centroGeral.y + tamanhoMax/2, centroGeral.z + tamanhoMax/2);
                camera.lookAt(centroGeral);

                modeloGeral.traverse(child => {
                    if (!child.isMesh) return;
                    const endLimpo = getEnderecoDaHierarquia(child);
                    if (!endLimpo) return;
                    if (!gruposGerais[endLimpo]) gruposGerais[endLimpo] = [];
                    gruposGerais[endLimpo].push(child);
                });

                if (Object.keys(dadosMap).length > 0) atualizarCoresEVisibilidade();
            }
        );

        let piscaLigado = false;
        setInterval(() => {
            piscaLigado = !piscaLigado;
            objetosCriticos.forEach(obj => {
                const endLimpo = getEnderecoDaHierarquia(obj);
                if (!listaSelecionadosLimpos.includes(endLimpo)) applyEmissive(obj, piscaLigado ? 0xff0000 : 0x000000, piscaLigado ? 0.9 : 0);
            });
        }, 500);

        // --- CORREÇÃO 1: FUNÇÕES DOS BOTÕES DE CÂMERA ---
        document.getElementById('btn-frente').addEventListener('click', () => {
            if(!modeloGeral) return;
            camera.position.set(centroGeral.x, centroGeral.y + tamanhoMax * 0.2, centroGeral.z + tamanhoMax * 0.8);
            controls.target.copy(centroGeral);
        });

        document.getElementById('btn-topo').addEventListener('click', () => {
            if(!modeloGeral) return;
            camera.position.set(centroGeral.x, centroGeral.y + tamanhoMax, centroGeral.z + 0.1); // +0.1 para evitar bug de giro no eixo Y
            controls.target.copy(centroGeral);
        });

        document.getElementById('btn-lado').addEventListener('click', () => {
            if(!modeloGeral) return;
            camera.position.set(centroGeral.x + tamanhoMax * 0.8, centroGeral.y + tamanhoMax * 0.2, centroGeral.z);
            controls.target.copy(centroGeral);
        });

        // --- CORREÇÃO 2: TOOLTIP ADAPTADO PARA O IFRAME ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-2, -2);
        const tooltip = document.getElementById('tooltip');

        // Usando pointermove (melhor que mousemove para iframes/telas touch)
        window.addEventListener('pointermove', function (event) {
            if (!modeloGeral) return;
            
            // Pega as dimensões reais da tela onde o canvas está renderizado
            const rect = renderer.domElement.getBoundingClientRect();
            
            // Calcula a posição do mouse de forma relativa ao iframe, não à janela inteira
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(modeloGeral, true);
            
            let endEncontrado = null;
            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.visible) {
                    endEncontrado = getEnderecoDaHierarquia(intersects[i].object);
                    if (endEncontrado) break;
                }
            }

            if (endEncontrado && dadosMap[endEncontrado]) {
                const dado = dadosMap[endEncontrado];
                tooltip.style.display = 'block';
                tooltip.style.left = (event.clientX + 15) + 'px';
                tooltip.style.top = (event.clientY + 15) + 'px';
                const pct = dado.capacidade > 0 ? ((dado.estoque / dado.capacidade) * 100).toFixed(0) : 0;
                tooltip.innerHTML = `<b>${dado.endereco}</b><br>Produto: ${dado.produto}<br>Ocupação: ${pct}%`;
                document.body.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        });

        // Garantir que a tela se redimensione caso o visual do Power BI mude de tamanho
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
